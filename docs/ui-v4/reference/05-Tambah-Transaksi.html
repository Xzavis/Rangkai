<script id="rangkai-preview-script">const dock=document.querySelector('nav[aria-label="Navigasi utama"]');
 if(dock){const syncDock=()=>document.body.style.setProperty('--rk-dock-height',dock.getBoundingClientRect().height+'px');new ResizeObserver(syncDock).observe(dock);syncDock();}
 document.addEventListener('click',function(event){
  const button=event.target.closest('button');if(!button)return;
  const icon=button.querySelector('.material-symbols-outlined');if(!icon)return;
  if(button.hasAttribute('data-rk-balance')){
   const section=button.closest('section');if(!section)return;
   const hide=button.getAttribute('aria-label')==='Sembunyikan saldo';
   for(const amount of section.querySelectorAll('.rk-amount')){
    if(!amount.dataset.rkOriginal)amount.dataset.rkOriginal=amount.textContent;
    amount.textContent=hide?'••••••':amount.dataset.rkOriginal;
   }
   icon.textContent=hide?'visibility_off':'visibility';button.setAttribute('aria-label',hide?'Tampilkan saldo':'Sembunyikan saldo');
  }else if(['visibility','visibility_off'].includes(icon.textContent.trim())){
   const input=button.closest('div')?.querySelector('input[type=password],input[type=text]');
   if(input){const show=input.type==='password';input.type=show?'text':'password';icon.textContent=show?'visibility_off':'visibility';button.setAttribute('aria-label',show?'Sembunyikan kata sandi':'Tampilkan kata sandi');}
  }
 });</script></body></html>
